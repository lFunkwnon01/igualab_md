<body class="bg-background min-h-screen flex items-center justify-center p-md sm:p-lg antialiased">
<!-- Login Card Container -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-[16px] border border-surface-variant p-xl shadow-[0_12px_32px_rgba(0,0,0,0.08)] flex flex-col items-center">
<!-- Logo -->
<div class="w-[64px] h-[64px] rounded-full bg-primary flex items-center justify-center mb-lg shadow-sm">
<span class="font-display-lg text-display-lg text-on-primary">I</span>
</div>
<!-- Title -->
<h1 class="font-headline-md text-headline-md text-on-background mb-xl text-center">Bienvenido a Igualab</h1>
<!-- Form -->
<form action="#" class="w-full flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-[12px] text-outline-variant" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-[44px] pr-[12px] rounded-xl border border-outline-variant bg-surface-container-lowest text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="tu@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-[12px] text-outline-variant" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-[44px] pr-[44px] rounded-xl border border-outline-variant bg-surface-container-lowest text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-[12px] text-outline-variant hover:text-on-surface-variant transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-sm">
<a class="font-label-md text-label-md text-primary hover:text-surface-tint hover:underline transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-sm bg-primary text-on-primary rounded-xl font-label-md text-label-md px-[12px] hover:bg-surface-tint active:bg-on-primary-fixed-variant transition-colors shadow-sm flex items-center justify-center gap-sm" type="submit">
                Iniciar sesión
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
